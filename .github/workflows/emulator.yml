name: Emulator smoke test

# Boots a real Android emulator, installs the APK, plays the game with input
# events, and captures screenshots, logcat and frame statistics. This is the
# only place the app actually RUNS, so it is where crashes get caught.

on:
  push:
    branches: [master, dev]
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          # The lean AOSP image on purpose. It has no Play Services, so this
          # run also proves the game degrades gracefully where the ads SDK
          # cannot work at all. A one-off google_apis run confirmed the SDK
          # initialises and preloads; that image is too overloaded for routine
          # CI - Play Services itself ANRs there and takes dependent processes
          # down with it.
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash .github/scripts/play.sh com.mikmy.tether hold

      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tether-emulator
          path: artifacts/**
          if-no-files-found: warn
          retention-days: 3
