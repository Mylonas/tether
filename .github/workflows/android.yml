name: Build APK

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Lint
        run: gradle --no-daemon lintRelease

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build release APK (R8 + resource shrinking)
        run: gradle --no-daemon assembleRelease

      - name: Build release AAB (Play Store upload format)
        run: gradle --no-daemon bundleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: tether-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 7

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tether-reports
          path: |
            app/build/reports/**
            app/build/outputs/lint-results-release.*
          if-no-files-found: ignore
          retention-days: 7
