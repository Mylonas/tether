name: Sync store listing

# One-off automation: captures the game running on an emulator, grabs a
# handful of screenshots, and pushes the listing text (title/descriptions)
# plus the icon, feature graphic and screenshots straight to the Play
# Developer API. No Play Console UI, no browser — everything runs on the
# GitHub-hosted runner.
#
# Needs PLAY_SERVICE_ACCOUNT_JSON (same secret publish.yml / play-status.yml
# use), and that service account needs "Manage store presence" permission in
# Play Console -> Users and permissions — a separate grant from the
# "Release apps to testing tracks" permission the publish workflow needs.

on:
  workflow_dispatch:
    inputs:
      language:
        description: "Play listing language"
        default: "en-US"
      screenshotCount:
        description: "How many captured screenshots to upload (2-8)"
        default: "4"

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture screenshots on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -no-boot-anim -camera-back none
          script: bash .github/scripts/play.sh com.mikmy.tether

      - name: Sync listing text and images to Play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE: com.mikmy.tether
          LANGUAGE: ${{ inputs.language }}
          SCREENSHOT_COUNT: ${{ inputs.screenshotCount }}
          TITLE: "Tether"
          SHORT_DESCRIPTION: "Grapple, swing, fly. The void is always rising."
          FULL_DESCRIPTION: |
            You are falling up a shaft with a void rising underneath you. Hold, and a grapple fires at the nearest anchor above, hauling you in. Let go, and you fly on whatever momentum you built.

            That's the entire control scheme - one touch, two states. Hold to grapple, release to fly.

            Riding a rope all the way in gives you the most speed, but costs time, and the void never stops climbing behind you. Letting go early keeps you moving but wastes the swing. Every run is that tension, over and over, faster each time.

            Tether is pure Kotlin on a canvas, with procedurally synthesised audio - no engine, no audio files, nothing extra weighing it down. It's a small, fast-loading game built around one honest idea.

            Free to play, supported by occasional interstitial ads between runs - never mid-climb, and capped so they don't get in your way. No account, no login required.

            How high can you climb before the void catches you?
        run: |
          python3 -m pip install --quiet google-auth requests
          python3 .github/scripts/sync_store_listing.py
