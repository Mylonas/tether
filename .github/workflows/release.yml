name: Signed release bundle

# Builds the AAB you upload to Play, signed with your upload key.
#
# Requires these repository secrets (Settings -> Secrets and variables ->
# Actions). None of them are ever printed; GitHub masks secret values in logs.
#
#   KEYSTORE_BASE64          base64 of your upload keystore (.p12 or .jks)
#   KEYSTORE_PASSWORD        its password
#   KEY_ALIAS                the key alias inside it
#   KEY_PASSWORD             the key password (same as the store one for a .p12)
#   ADMOB_APP_ID             ca-app-pub-XXXX~YYYY
#   ADMOB_INTERSTITIAL_ID    ca-app-pub-XXXX/ZZZZ
#
# See PLAYSTORE.md for how to produce the keystore and the base64.

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode — must be HIGHER than anything already uploaded"
        required: true
        default: "2"
      versionName:
        description: "versionName shown to users, e.g. 1.1"
        required: true
        default: "1.1"

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check the secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD \
                   ADMOB_APP_ID ADMOB_INTERSTITIAL_ID; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi
          echo "all six secrets are set"

      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          size=$(stat -c%s "$RUNNER_TEMP/upload.p12")
          echo "keystore decoded, $size bytes"
          if [ "$size" -lt 256 ]; then
            echo "::error::keystore looks too small — is KEYSTORE_BASE64 complete?"
            exit 1
          fi

      - name: Build the signed AAB and APK
        env:
          # ORG_GRADLE_PROJECT_* become Gradle properties without ever
          # appearing on a command line or in the process list.
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: ${{ runner.temp }}/upload.p12
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ inputs.versionCode }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ inputs.versionName }}
        run: gradle --no-daemon -PrequireRelease=true bundleRelease assembleRelease

      - name: Prove it is not debug-signed
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          sed -n '1,12p' certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::this build is signed with the DEBUG key; Play would reject it"
            exit 1
          fi
          echo "signed with a real upload key"

      - name: Shred the keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/upload.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/upload.p12"

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-release-v${{ inputs.versionCode }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
