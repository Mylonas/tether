name: Publish to Play

# Builds the signed AAB and uploads it straight to a Google Play testing track.
#
# Needs everything "Signed release bundle" needs, plus:
#
#   PLAY_SERVICE_ACCOUNT_JSON   the whole service-account JSON key file
#
# The service account must be invited under Play Console -> Users and
# permissions with "Release apps to testing tracks" on this app. Permission
# changes can take hours to propagate; a fresh key returning 403 usually means
# "wait", not "misconfigured".
#
# PRODUCTION IS DELIBERATELY NOT AN OPTION HERE. Internal and closed tracks only
# reach people you invited and can be replaced freely; a production rollout is
# public and cannot meaningfully be recalled. Add "production" to the choice
# list below only when you actually want that, as a conscious edit.

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: "versionCode — must be HIGHER than anything already uploaded"
        required: true
        default: "3"
      versionName:
        description: "versionName shown to users, e.g. 1.2"
        required: true
        default: "1.2"
      track:
        description: "Play track to release to"
        type: choice
        options:
          - internal
          - alpha
          - beta
        default: internal

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Check the secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD \
                   ADMOB_APP_ID ADMOB_INTERSTITIAL_ID PLAY_SERVICE_ACCOUNT_JSON; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi
          # Catch a truncated or half-pasted key before we spend six minutes building.
          if ! printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['type']=='service_account'; print('service account:', d['client_email'])"; then
            echo "::error::PLAY_SERVICE_ACCOUNT_JSON is not a valid service-account JSON key"
            exit 1
          fi

      - name: Decode the upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.p12"
          size=$(stat -c%s "$RUNNER_TEMP/upload.p12")
          echo "keystore decoded, $size bytes"
          if [ "$size" -lt 256 ]; then
            echo "::error::keystore looks too small — is KEYSTORE_BASE64 complete?"
            exit 1
          fi

      - name: Build the signed AAB and APK
        env:
          ORG_GRADLE_PROJECT_KEYSTORE_FILE: ${{ runner.temp }}/upload.p12
          ORG_GRADLE_PROJECT_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ORG_GRADLE_PROJECT_ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ORG_GRADLE_PROJECT_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ORG_GRADLE_PROJECT_VERSION_CODE: ${{ inputs.versionCode }}
          ORG_GRADLE_PROJECT_VERSION_NAME: ${{ inputs.versionName }}
        run: gradle --no-daemon -PrequireRelease=true bundleRelease assembleRelease

      - name: Prove it is not debug-signed
        run: |
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$APKSIGNER" verify --print-certs "$APK" > certs.txt
          sed -n '1,12p' certs.txt
          if grep -qi "CN=Android Debug" certs.txt; then
            echo "::error::this build is signed with the DEBUG key; Play would reject it"
            exit 1
          fi
          echo "signed with a real upload key"

      - name: Shred the keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/upload.p12" 2>/dev/null || rm -f "$RUNNER_TEMP/upload.p12"

      - name: Is there a what's-new note?
        id: whatsnew
        run: |
          if [ -d distribution/whatsnew ]; then
            echo "dir=distribution/whatsnew" >> "$GITHUB_OUTPUT"
          else
            echo "dir=" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload to Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.mikmy.tether
          releaseFiles: app/build/outputs/bundle/release/*.aab
          track: ${{ inputs.track }}
          status: completed
          mappingFile: app/build/outputs/mapping/release/mapping.txt
          whatsNewDirectory: ${{ steps.whatsnew.outputs.dir }}

      - name: Summary
        run: |
          {
            echo "### Published"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| package | \`com.mikmy.tether\` |"
            echo "| track | ${{ inputs.track }} |"
            echo "| versionCode | ${{ inputs.versionCode }} |"
            echo "| versionName | ${{ inputs.versionName }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep a copy of the bundle
        uses: actions/upload-artifact@v4
        with:
          name: play-published-v${{ inputs.versionCode }}
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
